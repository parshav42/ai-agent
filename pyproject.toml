[project]
name = "vs-code"
version = "0.1.0"
description = "Local-first CodePilot backend and AI provider abstraction"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "openai>=3.42.1",
    "python-dotenv>=1.2.4",
    "pytest>=8.3.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
vs-code = "vs_code.main:main"

[tool.pytest.ini_options]
pythonpath = ["src"]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
